services:
  mariadb:
    image: mariadb:11.8.8
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: creeping_crawler
      MARIADB_USER: creeping_crawler
      MARIADB_PASSWORD: creeping_crawler
    volumes:
      - ./mariadb_data/data:/var/lib/mysql
      - ./mariadb_data/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # Healthy only once the database accepts connections and InnoDB is ready.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  ollama:
    image: ollama/ollama:0.30.10
    restart: unless-stopped
    ports:
      - "11434:11434"
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      # Drives the pull in entrypoint.sh and the healthcheck below, so the
      # whole stack follows one setting.
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
      # The judge has its own, smaller model: it runs on every load of the
      # /parser page, and pinning the parser's model there made that page
      # time out on a machine this size.
      OLLAMA_JUDGE_MODEL: ${OLLAMA_JUDGE_MODEL:-llama3.2:3b}
    volumes:
      - ./ollama_data/data:/root/.ollama
      - ./ollama_data/entrypoint.sh:/entrypoint.sh
    healthcheck:
      # Healthy only once the model has finished downloading.
      # On the first boot the pull can take a few minutes.
      test: ["CMD-SHELL", "ollama list | grep -q \"$${OLLAMA_MODEL}\""]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      DB_HOST: mariadb
      DB_NAME: creeping_crawler
      DB_USER: creeping_crawler
      DB_PASSWORD: creeping_crawler
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
      # The judge scores extractions on every load of the /parser page, so it
      # gets the smallest model that can give a verdict rather than the one
      # the parser needs. Sharing the parser's model made that page time out.
      OLLAMA_JUDGE_MODEL: ${OLLAMA_JUDGE_MODEL:-llama3.2:3b}
      # Left unset, Ollama unloads an idle model after a few minutes. Pinning
      # it (keep_alive -1) held over half of this machine's Docker memory for
      # good and made every other call crawl.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-}
      # Left unset, the backend talks to the local Ollama exactly as before.
      # Set LLM_PROVIDER=openrouter (plus a key) to reach the models that do
      # not fit in local RAM.
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen3.5-9b}
      OPENROUTER_PROVIDER: ${OPENROUTER_PROVIDER:-}
      # How much the LLM parser may read and write. The defaults match what
      # the code assumes on its own, so leaving these unset changes nothing.
      LLM_PARSER_CONTEXT_TOKENS: ${LLM_PARSER_CONTEXT_TOKENS:-}
      LLM_PARSER_MAX_TOKENS: ${LLM_PARSER_MAX_TOKENS:-}
      # Off by default: a page that does not fit is reported as too long
      # rather than read in pieces, which is what every recorded run did.
      LLM_PARSER_CHUNKING: ${LLM_PARSER_CHUNKING:-0}
      LLM_EUR_PER_USD: ${LLM_EUR_PER_USD:-}
      # What running something locally costs, for the comparison against a
      # billed provider. Facts about one laptop and one electricity contract,
      # not about this project, so they live here and not in the code.
      # Misurato con powermetrics su questo MacBook Air M1: 1,65 W sotto
      # carico contro 0,13 W a riposo. E' la potenza IN PIU' dovuta al lavoro,
      # non il consumo della macchina, ed e' potenza del chip: schermo, SSD e
      # perdite dell'alimentatore restano fuori, come devono, perche' lo
      # schermo e' acceso comunque.
      LOCAL_POWER_WATTS: ${LOCAL_POWER_WATTS:-1.52}
      ELECTRICITY_EUR_PER_KWH: ${ELECTRICITY_EUR_PER_KWH:-0.236}
      HARDWARE_EUR: ${HARDWARE_EUR:-1250.74}
      HARDWARE_LIFETIME_YEARS: ${HARDWARE_LIFETIME_YEARS:-8}
    volumes:
      # Results of the evaluation runs. The image does not carry them (output/
      # is in .dockerignore) and without this they live only inside a running
      # container, so rebuilding the image throws away files that cost real
      # money to produce.
      - ./output:/app/output
    depends_on:
      mariadb:
        condition: service_healthy
      ollama:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      BACKEND_URL: http://backend:8003
    depends_on:
      - backend
